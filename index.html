<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGNAL — AI · AR · VR · Future Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="#">
        <div class="logo-mark">SIG</div>
        <span class="logo-text">SIGNAL</span>
      </a>
      <div class="header-meta">
        <span class="last-updated" id="lastUpdated">—</span>
        
        <!-- DARK MODE TOGGLE -->
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <button class="refresh-btn" onclick="loadNews()">↻ REFRESH</button>
      </div>
    </div>
  </header>

  <div class="ticker-wrap">
    <span class="ticker-label">BREAKING FEED</span>
    <div class="ticker-track" id="tickerTrack">
      <span class="ticker-item">Awaiting hot tech updates…</span>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-tabs">
      <button class="filter-tab active" data-cat="ALL" onclick="setFilter('ALL',this)">ALL</button>
      <button class="filter-tab" data-cat="AI"   onclick="setFilter('AI',this)">🤖 AI</button>
      <button class="filter-tab" data-cat="AR"   onclick="setFilter('AR',this)">👓 AR</button>
      <button class="filter-tab" data-cat="VR"   onclick="setFilter('VR',this)">🥽 VR</button>
      <button class="filter-tab" data-cat="Tech" onclick="setFilter('Tech',this)">⚡ TECH</button>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color: var(--muted);">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="search" id="searchInput" placeholder="Search breaking stories…" oninput="renderGrid()">
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div id="appContent">
    <div class="spinner"></div>
  </div>

  <footer>
    <div class="footer-inner">
      <span class="footer-text">
        SIGNAL — Serverless Front-end Engine &bull; Run fully on browser native JavaScript.
      </span>
      <span class="footer-text">
        Sources: TechCrunch · The Verge · Wired · Ars Technica · CNET · Engadget · TechRadar · Gizmodo · ZDNET · Digital Trends
      </span>
    </div>
  </footer>

</body>
</html>
